name: Android Release CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 2. Tự động chuyển đổi tên ứng dụng (Slugify App Name)
      - name: Slugify App Name
        id: slugify
        run: |
          RAW_NAME="${{ github.event.repository.name }}"
          if [ -z "$RAW_NAME" ]; then
            RAW_NAME=$(basename "${{ github.repository }}")
          fi
          # Chuyển thành chữ thường và thay thế khoảng trắng/gạch dưới thành gạch ngang
          SLUG_NAME=$(echo "$RAW_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's/[ _]+/-/g')
          echo "SLUG_NAME=$SLUG_NAME" >> $GITHUB_ENV
          echo "Slugified App Name: $SLUG_NAME"

      # 3. Tự động tăng phiên bản Release (Auto-Increment Versioning)
      - name: Calculate Next Version Tag
        id: versioning
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          # Lấy tag mới nhất qua GitHub REST API
          LATEST_TAG=$(curl -s -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$REPO/releases/latest" | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/' || echo "")
          echo "Latest tag on GitHub: '$LATEST_TAG'"

          if [ -z "$LATEST_TAG" ] || [ "$LATEST_TAG" = "null" ]; then
            NEW_TAG="v1.0"
          else
            CLEAN_VER="${LATEST_TAG#v}"
            MAJOR=$(echo "$CLEAN_VER" | cut -d. -f1)
            MINOR=$(echo "$CLEAN_VER" | cut -d. -f2)

            MAJOR=${MAJOR:-1}
            MINOR=${MINOR:-0}

            NEW_MINOR=$((MINOR + 1))
            NEW_TAG="v${MAJOR}.${NEW_MINOR}"
          fi

          echo "NEW_TAG=$NEW_TAG" >> $GITHUB_ENV
          echo "Calculated New Version: $NEW_TAG"

      # Khôi phục google-services.json nếu có
      - name: Restore google-services.json
        env:
          GOOGLE_SERVICES_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_BASE64" ]; then
            echo "$GOOGLE_SERVICES_BASE64" | base64 -d > app/google-services.json
            echo "Successfully restored google-services.json"
          fi

      # 4. Giải mã Keystore từ GitHub Secrets
      - name: Restore Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/release-keystore.jks
            echo "Successfully restored release keystore"
          fi

      - name: Grant Execute Permission for Gradlew
        run: |
          chmod +x gradlew
          sed -i '/org.gradle.java.home/d' gradle.properties || true

      # 4. Build & Ký số APK
      - name: Build & Sign Release APK
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -f app/release-keystore.jks ] && [ -n "$STORE_PASSWORD" ]; then
            echo "Building and signing release APK..."
            ./gradlew :app:assembleRelease \
              -Pandroid.injected.signing.store.file=$(pwd)/app/release-keystore.jks \
              -Pandroid.injected.signing.store.password="$STORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$KEY_PASSWORD" \
              --stacktrace
          else
            echo "Keystore not provided or incomplete password, building release with default configuration..."
            ./gradlew :app:assembleRelease --stacktrace
          fi

      # 5. Đổi tên APK theo chuẩn <slugified-app-name>-<version>.apk
      - name: Rename Output APK
        id: rename_apk
        run: |
          APK_FILE=$(find app/build/outputs/apk/release -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "Error: Output APK file not found!"
            exit 1
          fi

          FINAL_APK_NAME="${SLUG_NAME}-${NEW_TAG}.apk"
          FINAL_APK_PATH="app/build/outputs/apk/release/${FINAL_APK_NAME}"

          mv "$APK_FILE" "$FINAL_APK_PATH"

          echo "FINAL_APK_PATH=$FINAL_APK_PATH" >> $GITHUB_ENV
          echo "FINAL_APK_NAME=$FINAL_APK_NAME" >> $GITHUB_ENV
          echo "Renamed APK to: $FINAL_APK_NAME"

      # 5. Upload APK lên GitHub Release
      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.NEW_TAG }}
          name: Release ${{ env.NEW_TAG }}
          files: ${{ env.FINAL_APK_PATH }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
