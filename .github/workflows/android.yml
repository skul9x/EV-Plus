name: Android Release CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 1. Slugify Repository Name (Ví dụ: "My_Cool App" -> "my-cool-app")
      - name: Slugify App Name
        id: slugify
        run: |
          RAW_NAME="${{ github.event.repository.name }}"
          if [ -z "$RAW_NAME" ]; then
            RAW_NAME=$(basename "${{ github.repository }}")
          fi
          # Chuyển thành chữ thường và thay thế khoảng trắng/gạch dưới thành gạch ngang
          SLUG_NAME=$(echo "$RAW_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's/[ _]+/-/g')
          echo "SLUG_NAME=$SLUG_NAME" >> $GITHUB_ENV
          echo "Tên App sau khi chuẩn hóa: $SLUG_NAME"

      # 2. Tự động xác định version kế tiếp từ GitHub Release tag
      - name: Calculate Next Version Tag
        id: versioning
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST_TAG=$(gh release view --json tagName -q .tagName 2>/dev/null || echo "")
          echo "Tag hiện tại trên GitHub: '$LATEST_TAG'"

          if [ -z "$LATEST_TAG" ]; then
            NEW_TAG="v1.0"
          else
            # Tách version (bỏ ký tự 'v' nếu có)
            CLEAN_VER="${LATEST_TAG#v}"
            MAJOR=$(echo "$CLEAN_VER" | cut -d. -f1)
            MINOR=$(echo "$CLEAN_VER" | cut -d. -f2)

            # Đảm bảo có giá trị số
            MAJOR=${MAJOR:-1}
            MINOR=${MINOR:-0}

            # Tăng minor version (ví dụ: v1.0 -> v1.1)
            NEW_MINOR=$((MINOR + 1))
            NEW_TAG="v${MAJOR}.${NEW_MINOR}"
          fi

          echo "NEW_TAG=$NEW_TAG" >> $GITHUB_ENV
          echo "Phiên bản Release tiếp theo: $NEW_TAG"

      # 3. Giải mã google-services.json từ GitHub Secrets
      - name: Restore google-services.json
        if: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 != '' }}
        env:
          GOOGLE_SERVICES_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          echo "$GOOGLE_SERVICES_BASE64" | base64 -d > app/google-services.json

      # 4. Giải mã Keystore từ GitHub Secrets (nếu có)
      - name: Restore Release Keystore
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > app/release-keystore.jks

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x gradlew

      # 5. Build Release APK và ký số
      - name: Build & Sign Release APK
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -f app/release-keystore.jks ] && [ -n "$STORE_PASSWORD" ]; then
            echo "Đang build và ký số APK bằng Keystore từ Secrets..."
            ./gradlew :app:assembleRelease \
              -Pandroid.injected.signing.store.file=$(pwd)/app/release-keystore.jks \
              -Pandroid.injected.signing.store.password="$STORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$KEY_PASSWORD" \
              --stacktrace
          else
            echo "Không tìm thấy Keystore Secrets, build Release mặc định..."
            ./gradlew :app:assembleRelease --stacktrace
          fi

      # 6. Đổi tên APK theo chuẩn <slugified-app-name>-<version>.apk
      - name: Rename Output APK
        id: rename_apk
        run: |
          APK_FILE=$(find app/build/outputs/apk/release -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "Lỗi: Không tìm thấy file APK sau khi build!"
            exit 1
          fi

          FINAL_APK_NAME="${SLUG_NAME}-${NEW_TAG}.apk"
          FINAL_APK_PATH="app/build/outputs/apk/release/${FINAL_APK_NAME}"

          mv "$APK_FILE" "$FINAL_APK_PATH"

          echo "FINAL_APK_PATH=$FINAL_APK_PATH" >> $GITHUB_ENV
          echo "FINAL_APK_NAME=$FINAL_APK_NAME" >> $GITHUB_ENV
          echo "APK đã được đổi tên thành: $FINAL_APK_NAME"

      # 7. Tạo GitHub Release và đính kèm file APK
      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.NEW_TAG }}
          name: Release ${{ env.NEW_TAG }}
          files: ${{ env.FINAL_APK_PATH }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
